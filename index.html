<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharosaVerify — Dukaan ka Bharosa Check Karo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<body class="bg-gray-50 min-h-screen">

<div id="app"></div>

<script>
// ==========================================
// 1. SUPABASE SETUP (Aapki Keys Add Ho Chuki Hain)
// ==========================================
const SUPABASE_URL = 'https://nevaxbwwvurcjvdnigql.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable__VmFHuU6tw3vuOAJ6vKx4A_093Am2Nu'; 

let supabaseClient = null;
let currentUser = null;

if (SUPABASE_URL && SUPABASE_KEY) {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  // Check if user is already logged in
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    currentUser = session?.user || null;
    render();
  });
}

// ==========================================
// 2. APP CONFIG & DATA
// ==========================================
const PORTALS = {
  gst: { name: "GST Portal (Official)", url: "https://services.gst.gov.in/services/searchtp", fieldName: "GSTIN/UIN", icon: "🏛️", steps_hi: ["GSTIN clipboard se paste karein", "Captcha bharein (agar aaye)", "'Search' button dabayein", "Status check karein: Active / Cancelled / Suspended"], steps_en: ["Paste GSTIN from clipboard", "Fill captcha (if prompted)", "Click 'Search'", "Check status: Active / Cancelled / Suspended"] },
  fssai: { name: "FoSCoS (FSSAI Official)", url: "https://foscos.fssai.gov.in", fieldName: "License/Registration Number", icon: "🍽️", steps_hi: ["Homepage par 'Know Your License' section kholo", "License number paste karein", "Captcha solve karein", "License validity aur category check karein"], steps_en: ["Open 'Know Your License' section on homepage", "Paste license number", "Solve captcha", "Check license validity and category"] },
  udyam: { name: "Udyam Registration Portal", url: "https://udyamregistration.gov.in/Udyam_Verify.aspx", fieldName: "Udyam Registration Number", icon: "🏭", steps_hi: ["'Verify Udyam Registration Number' page kholo", "Udyam number paste karein", "Captcha bharein", "'Verify' dabayein"], steps_en: ["Open 'Verify Udyam Registration Number' page", "Paste Udyam number", "Fill captcha", "Click 'Verify'"] },
  shop: { name: "Shop & Establishment (State Portal)", url: "https://labour.gov.in/", fieldName: "Shop License Number", icon: "🏪", steps_hi: ["Apne state ka Shop & Establishment portal kholo", "License number daalo", "Status check karo"], steps_en: ["Open your state's Shop & Establishment portal", "Enter license number", "Check status"] }
};

// Fallback Data (Agar Supabase mein tables nahi bani hongi toh ye dikhega)
let FALLBACK_SHOPS = [
  {
    id: 1, name: "Sharma Kirana Store (Offline Mode)", category: "Kirana / Grocery", address: "Shop 12, Main Market, Karol Bagh, New Delhi", phone: "9876543210", area: "Karol Bagh, Delhi", owner: "Ramesh Sharma",
    certificates: { gst: { number: "07ABCDE1234F1Z5", expiry: "2027-03-31", status: "unverified" }, fssai: { number: "12345678901234", expiry: "2027-12-31", status: "admin_reviewed", verifiedAt: "2026-10-15" } },
    communityChecks: 5, adminReviews: 1
  }
];

let shops = JSON.parse(localStorage.getItem('bv_shops') || 'null') || FALLBACK_SHOPS;
let reports = JSON.parse(localStorage.getItem('bv_reports') || '[]');
let lang = localStorage.getItem('bv_lang') || 'hi';
let currentView = 'home';
let currentShopId = null;

// ==========================================
// 3. SUPABASE FETCH LOGIC
// ==========================================
async function loadSupabaseData() {
  if (!supabaseClient) return;

  try {
    const { data: bizData, error: bizErr } = await supabaseClient.from('businesses').select('*, certificates(*)');
    if (!bizErr && bizData && bizData.length > 0) {
      shops = bizData.map(b => ({
        id: b.id, name: b.name, category: b.category, address: b.address, phone: b.phone, area: b.area, owner: b.owner, communityChecks: b.community_checks, adminReviews: b.admin_reviews,
        certificates: (b.certificates || []).reduce((acc, c) => {
          acc[c.type] = { number: c.number, expiry: c.expiry, status: c.status, verifiedAt: c.verified_at };
          return acc;
        }, {})
      }));
    }

    const { data: repData } = await supabaseClient.from('reports').select('*');
    if (repData) reports = repData.map(r => ({ id: r.id, shopId: r.business_id, reason: r.reason, detail: r.detail, date: r.created_at, status: r.status }));

    render();
  } catch (e) { console.error("DB Error", e); }
}

function save() {
  localStorage.setItem('bv_shops', JSON.stringify(shops));
  localStorage.setItem('bv_reports', JSON.stringify(reports));
  localStorage.setItem('bv_lang', lang);
}

// ==========================================
// 4. LOGIN & AUTH LOGIC
// ==========================================
async function handleLogin() {
  if (!supabaseClient) { alert("Database configure nahi hai."); return; }
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPassword').value;
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
  if (error) {
    alert("Login Failed: " + error.message);
  } else {
    currentUser = data.user;
    document.querySelectorAll('.fixed.inset-0').forEach(m => m.remove());
    render();
  }
}

async function handleLogout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
  currentUser = null;
  navigate('home');
}

function showLoginModal() {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full fade-in">
      <h3 class="text-lg font-bold mb-4">Admin Login</h3>
      <input id="loginEmail" type="email" placeholder="Email" class="w-full border border-gray-200 rounded-xl px-3 py-2 mb-3 text-sm">
      <input id="loginPassword" type="password" placeholder="Password" class="w-full border border-gray-200 rounded-xl px-3 py-2 mb-4 text-sm">
      <button onclick="handleLogin()" class="w-full bg-gray-900 text-white py-3 rounded-xl font-semibold text-sm mb-2">Login</button>
      <button onclick="this.closest('.fixed').remove()" class="w-full text-gray-500 text-xs py-2">Cancel</button>
    </div>
  `;
  document.body.appendChild(modal);
}

// ==========================================
// 5. TRANSLATIONS & HELPERS
// ==========================================
const T = {
  hi: { brand: "BharosaVerify", tagline: "Dukaan ka bharosa, ek click mein", searchPlaceholder: "Dukaan ka naam, GSTIN, FSSAI ya phone daalo...", search: "Khojo", home: "Home", admin: "Admin Panel", back: "Wapas", certificates: "Certificates", copyVerify: "Copy & Verify", copyVerifyHint: "Number copy ho jayega aur official portal khulega", communityChecks: "Logon ne check kiya", adminReviewed: "Admin ne verify kiya", reportShop: "Report karo", showQR: "QR dikhao", portal: "Official Portal", steps: "Kaise check karein", status: { unverified: "Unverified", admin_reviewed: "Admin reviewed", community: "Community verified", expired: "Expired" }, statusDesc: { unverified: "Kisi ne verify nahi kiya. Khud official portal par check karo.", admin_reviewed: "Admin ne document dekh kar approve kiya hai.", expired: "Expiry date nikal chuki hai. Dukaan se puchho." }, reportTitle: "Issue report karo", reportReason: "Kya problem hai?", reportPlaceholder: "Detail likho...", reportSubmit: "Report bhejo", reportSuccess: "Report bhej di gayi. Admin review karega.", toastCopied: "✅ Number copy ho gaya! Official portal par paste karein.", toastChecked: "Shukriya! Aapka verification record ho gaya.", noResults: "Kuch nahi mila. Doosre keyword se try karo.", trustScore: "Trust Score", adminPending: "Pending Reports", noPending: "Koi report pending nahi hai.", markReviewed: "Reviewed mark karo", expiryDate: "Expiry", verifiedOn: "Verified on", fieldToCopy: "Yeh copy hoga", login: "Login", logout: "Logout", terms: "Terms & Disclaimer" },
  en: { brand: "BharosaVerify", tagline: "Trust your shop, in one click", searchPlaceholder: "Search shop name, GSTIN, FSSAI, or phone...", search: "Search", home: "Home", admin: "Admin Panel", back: "Back", certificates: "Certificates", copyVerify: "Copy & Verify", copyVerifyHint: "Number will be copied and official portal will open", communityChecks: "Community checks", adminReviewed: "Admin reviewed", reportShop: "Report", showQR: "Show QR", portal: "Official Portal", steps: "How to check", status: { unverified: "Unverified", admin_reviewed: "Admin reviewed", community: "Community verified", expired: "Expired" }, statusDesc: { unverified: "Nobody has verified this. Check on the official portal yourself.", admin_reviewed: "Admin has reviewed the document and approved it.", expired: "Expiry date has passed. Ask the shop." }, reportTitle: "Report an issue", reportReason: "What's the problem?", reportPlaceholder: "Write details...", reportSubmit: "Submit report", reportSuccess: "Report submitted.", toastCopied: "✅ Number copied! Paste it on the official portal.", toastChecked: "Thanks! Your verification has been recorded.", noResults: "No results. Try another keyword.", trustScore: "Trust Score", adminPending: "Pending Reports", noPending: "No pending reports.", markReviewed: "Mark reviewed", expiryDate: "Expiry", verifiedOn: "Verified on", fieldToCopy: "This will be copied", login: "Login", logout: "Logout", terms: "Terms & Disclaimer" }
};
function t(key) { return T[lang][key] || T.hi[key] || key; }
function trustScore(shop) {
  const certs = Object.values(shop.certificates || {});
  if (certs.length === 0) return 20;
  let base = 30, reviewed = 0, expired = 0;
  for (const c of certs) { if (c.status === 'admin_reviewed') reviewed++; if (c.status === 'expired') expired++; if (c.status === 'unverified') base += 8; }
  base += reviewed * 18; base -= expired * 15; base += Math.min(shop.communityChecks * 2, 20);
  return Math.max(10, Math.min(98, base));
}
function catIcon(cat) {
  if (/Food|Restaurant|Tiffin|Bakery|Sweet|Dairy/i.test(cat)) return "🍽️"; if (/Salon|Beauty/i.test(cat)) return "💇"; if (/Mobile|Electronics/i.test(cat)) return "📱"; if (/Pharmacy|Ayurveda/i.test(cat)) return "💊"; if (/Kirana|Grocery/i.test(cat)) return "🛒"; return "🏪";
}
function showToast(msg, type='success') {
  const toast = document.createElement('div');
  toast.className = `toast-enter fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl text-white font-medium text-sm shadow-2xl max-w-md ${type === 'error' ? 'bg-red-600' : 'bg-gray-900'}`;
  toast.textContent = msg; document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => toast.remove(), 3600);
}

// ==========================================
// 6. NAVIGATION & RENDERING
// ==========================================
function navigate(view, id=null) {
  currentView = view; currentShopId = id;
  if (view === 'admin' && supabaseClient && !currentUser) { showLoginModal(); return; }
  render(); window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (currentView === 'home') app.innerHTML = renderHome();
  else if (currentView === 'shop') app.innerHTML = renderShop(currentShopId);
  else if (currentView === 'admin') app.innerHTML = renderAdmin();
  else if (currentView === 'terms') app.innerHTML = renderTerms();
  app.classList.add('fade-in');
}

function renderTerms() {
  return `
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="navigate('home')" class="flex items-center gap-2 text-gray-700 hover:text-gray-900">
        <span>←</span> <span class="text-sm font-medium">${t('back')}</span>
      </button>
      <span class="text-sm font-bold">${t('terms')}</span>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-4 text-gray-900">Terms of Service & Disclaimer</h1>

      <p><strong>1. Government Affiliation:</strong> BharosaVerify is NOT a government app. We are an independent platform that helps users find official verification portals.</p>
      <p><strong>2. Verification Accuracy:</strong> We do not guarantee the accuracy of the data shown here. Certificates marked as "Admin reviewed" are based on documents uploaded by users. Always cross-check on the official GST or FSSAI portal.</p>
      <p><strong>3. Data Privacy:</strong> We do not sell your data. Your phone number or email is used only for login purposes.</p>
      <p><strong>4. Liability:</strong> We are not liable for any financial loss or damages arising from using this platform. Use at your own risk.</p>
    </div>
  </main>`;
}

function renderHome() {
  const q = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  const filtered = shops.filter(s => {
    if (!q) return true;
    const certNumbers = Object.values(s.certificates || {}).map(c => c.number).join(' ');
    return (s.name + ' ' + s.phone + ' ' + s.address + ' ' + s.category + ' ' + certNumbers).toLowerCase().includes(q);
  });

  return `
  <header class="gradient-hero text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
        <span class="text-2xl">🛡️</span>
        <span class="font-bold text-lg">${t('brand')}</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleLang()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-medium">${lang === 'hi' ? 'EN' : 'हिं'}</button>
        ${currentUser ? `<button onclick="handleLogout()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-medium">${t('logout')}</button>` : `<button onclick="showLoginModal()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-medium">${t('login')}</button>`}
        <button onclick="navigate('admin')" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-medium">${t('admin')}</button>
      </div>
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-10 pt-2 text-center">
      <h1 class="text-3xl sm:text-4xl font-extrabold mb-2">${t('tagline')}</h1>
      <p class="text-white/80 text-sm mb-6">GST · FSSAI · Udyam · Shop License — sab official source se check karo</p>
      <div class="relative">
        <input id="searchInput" type="text" oninput="render()" value="${q}" placeholder="${t('searchPlaceholder')}" class="w-full px-5 py-4 pr-32 rounded-2xl text-gray-900 shadow-xl focus:outline-none focus:ring-4 focus:ring-white/30" />
        <button class="absolute right-2 top-2 bottom-2 bg-gray-900 text-white px-5 rounded-xl font-semibold text-sm hover:bg-gray-800">${t('search')}</button>
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold text-gray-900">${filtered.length} dukaan mile</h2>
    </div>
    ${filtered.length === 0 ? `<div class="text-center py-16 text-gray-500">${t('noResults')}</div>` : `<div class="grid gap-3 sm:grid-cols-2">${filtered.map(s => shopCard(s)).join('')}</div>`}
    
    <!-- FOOTER -->
    <footer class="mt-12 py-6 text-center text-xs text-gray-400 border-t border-gray-200">
      <p class="mb-2">BharosaVerify © 2026</p>
      <div class="space-x-4">
        <span onclick="navigate('terms')" class="cursor-pointer hover:text-gray-600 underline">Terms & Disclaimer</span>
        <span onclick="navigate('terms')" class="cursor-pointer hover:text-gray-600 underline">Privacy Policy</span>
      </div>
    </footer>
  </main>`;
}

function shopCard(s) {
  const score = trustScore(s);
  const scoreColor = score >= 70 ? 'bg-green-500' : score >= 40 ? 'bg-amber-500' : 'bg-red-500';
  return `
  <div onclick="navigate('shop',${s.id})" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:shadow-md hover:border-gray-200 cursor-pointer transition-all">
    <div class="flex items-start gap-3">
      <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-2xl flex-shrink-0">${catIcon(s.category)}</div>
      <div class="flex-1 min-w-0">
        <h3 class="font-bold text-gray-900 truncate">${s.name}</h3>
        <p class="text-xs text-gray-500 truncate">${s.category}</p>
        <p class="text-xs text-gray-400 truncate mt-1">${s.area}</p>
        <div class="flex items-center gap-2 mt-2 flex-wrap">${Object.entries(s.certificates).slice(0,3).map(([k,v]) => statusPill(v.status)).join('')}</div>
      </div>
      <div class="text-right flex-shrink-0">
        <div class="text-xs text-gray-500 mb-1">${t('trustScore')}</div>
        <div class="inline-flex items-center gap-1 px-2 py-1 rounded-lg ${scoreColor} text-white text-sm font-bold">${score}</div>
      </div>
    </div>
  </div>`;
}

function renderShop(id) {
  const s = shops.find(x => x.id === id);
  if (!s) return `<div class="p-8 text-center">Shop not found</div>`;
  const score = trustScore(s);
  const scoreColor = score >= 70 ? 'text-green-600' : score >= 40 ? 'text-amber-600' : 'text-red-600';

  return `
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="navigate('home')" class="flex items-center gap-2 text-gray-700 hover:text-gray-900"><span>←</span> <span class="text-sm font-medium">${t('back')}</span></button>
      <div class="flex items-center gap-2">
        <button onclick="showQR(${s.id})" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-medium">${t('showQR')}</button>
        <button onclick="showReport(${s.id})" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 px-3 py-1.5 rounded-lg font-medium">${t('reportShop')}</button>
      </div>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-5">
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
      <div class="flex items-start gap-4">
        <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center text-3xl flex-shrink-0">${catIcon(s.category)}</div>
        <div class="flex-1 min-w-0">
          <h1 class="text-xl font-bold text-gray-900">${s.name}</h1>
          <p class="text-sm text-gray-500">${s.category}</p>
          <p class="text-xs text-gray-400 mt-2">📍 ${s.address}</p>
          <p class="text-xs text-gray-400 mt-1">📞 ${s.phone} · 👤 ${s.owner}</p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-3 gap-2 text-center">
        <div><div class="text-2xl font-bold ${scoreColor}">${score}</div><div class="text-xs text-gray-500">${t('trustScore')}</div></div>
        <div><div class="text-2xl font-bold text-gray-900">${s.communityChecks || 0}</div><div class="text-xs text-gray-500">${t('communityChecks')}</div></div>
        <div><div class="text-2xl font-bold text-gray-900">${s.adminReviews || 0}</div><div class="text-xs text-gray-500">${t('adminReviewed')}</div></div>
      </div>
    </div>
    <h2 class="font-bold text-gray-900 mb-3 px-1">${t('certificates')}</h2>
    <div class="space-y-3">
      ${Object.entries(s.certificates).map(([type, cert]) => renderCertCard(s.id, type, cert)).join('')}
    </div>
  </main>`;
}

function renderCertCard(shopId, type, cert) {
  const portal = PORTALS[type]; if (!portal) return '';
  const isExpired = cert.expiry && new Date(cert.expiry) < new Date();
  const effectiveStatus = isExpired && cert.status !== 'expired' ? 'expired' : cert.status;
  return `
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
    <div class="flex items-start justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">${portal.icon}</span>
        <div><div class="font-semibold text-gray-900 text-sm">${portal.name.split('(')[0].trim()}</div><div class="text-xs text-gray-500">${portal.fieldName}</div></div>
      </div>
      ${statusPill(effectiveStatus)}
    </div>
    <div class="bg-gray-50 rounded-xl px-3 py-2 my-3"><code class="text-xs font-mono text-gray-800 break-all">${cert.number}</code></div>
    ${cert.expiry ? `<div class="text-xs text-gray-500 mb-3">📅 ${t('expiryDate')}: ${cert.expiry}${cert.verifiedAt ? ` · ✓ ${t('verifiedOn')} ${cert.verifiedAt}` : ''}</div>` : ''}
    <p class="text-xs text-gray-500 mb-3">${t('statusDesc')[effectiveStatus] || ''}</p>
    <button onclick="copyAndVerify(${shopId},'${type}')" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2"><span>📋</span> ${t('copyVerify')} →</button>
    <p class="text-xs text-gray-400 text-center mt-2">${t('copyVerifyHint')}</p>
  </div>`;
}

// Modals & Actions
function copyAndVerify(shopId, certType) {
  const shop = shops.find(s => s.id === shopId); const cert = shop.certificates[certType]; const portal = PORTALS[certType];
  if (!cert || !portal) return;
  navigator.clipboard.writeText(cert.number).then(() => showToast(t('toastCopied'))).catch(() => {
    const ta = document.createElement('textarea'); ta.value = cert.number; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast(t('toastCopied'));
  });
  setTimeout(() => window.open(portal.url, '_blank'), 400);
  showVerificationSteps(shopId, certType);
}

function showVerificationSteps(shopId, certType) {
  const shop = shops.find(s => s.id === shopId); const cert = shop.certificates[certType]; const portal = PORTALS[certType];
  const steps = lang === 'hi' ? portal.steps_hi : portal.steps_en;
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/60 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 fade-in max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between mb-4">
        <div><div class="text-3xl mb-1">${portal.icon}</div><h3 class="text-lg font-bold text-gray-900">${portal.name}</h3><p class="text-xs text-gray-500 mt-1">${t('portal')}</p></div>
        <button onclick="this.closest('.fixed').remove()" class="text-gray-400 text-2xl leading-none">×</button>
      </div>
      <div class="bg-green-50 border border-green-200 rounded-xl p-3 mb-4">
        <p class="text-xs text-green-800 mb-1 font-semibold">${t('fieldToCopy')}</p>
        <div class="flex items-center gap-2"><code class="flex-1 font-mono text-sm text-gray-800 break-all">${cert.number}</code><span class="text-xs bg-green-600 text-white px-2 py-1 rounded-md">Copied ✓</span></div>
      </div>
      <h4 class="font-semibold text-gray-900 mb-3 text-sm">${t('steps')}:</h4>
      <ol class="space-y-2 mb-5">${steps.map((s, i) => `<li class="flex gap-3 text-sm text-gray-700"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-gray-900 text-white flex items-center justify-center text-xs font-bold">${i+1}</span><span class="pt-0.5">${s}</span></li>`).join('')}</ol>
      <div class="space-y-2">
        <a href="${portal.url}" target="_blank" class="block w-full text-center bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-xl font-semibold text-sm">Portal phir se kholo →</a>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="markCheck(${shopId},'${certType}','active')" class="bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl text-sm font-medium">✅ Active tha</button>
          <button onclick="markCheck(${shopId},'${certType}','expired')" class="bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-sm font-medium">❌ Expired tha</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function markCheck(shopId, certType, result) {
  const shop = shops.find(s => s.id === shopId); if (!shop) return; const cert = shop.certificates[certType];
  if (result === 'active' && cert.status === 'unverified') cert.status = 'community';
  else if (result === 'expired') cert.status = 'expired';
  shop.communityChecks = (shop.communityChecks || 0) + 1; save();
  document.querySelectorAll('.fixed.inset-0').forEach(m => m.remove()); showToast(t('toastChecked')); render();
}

function statusPill(status) {
  const styles = { unverified: 'bg-gray-100 text-gray-700 border-gray-200', admin_reviewed: 'bg-blue-50 text-blue-700 border-blue-200', community: 'bg-green-50 text-green-700 border-green-200', expired: 'bg-red-50 text-red-700 border-red-200' };
  const icons = { unverified: '⚪', admin_reviewed: '🔵', community: '🟢', expired: '🔴' };
  return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium border ${styles[status] || styles.unverified}">${icons[status] || ''} ${t('status')[status] || status}</span>`;
}

function showQR(shopId) {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  const shop = shops.find(s => s.id === shopId);
  modal.innerHTML = `<div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center fade-in"><h3 class="font-bold mb-1">${shop.name}</h3><p class="text-xs text-gray-500 mb-4">Scan karo aur verify karo</p><div id="qrCanvas" class="inline-block p-3 bg-white border-2 border-gray-200 rounded-2xl"></div><p class="text-xs text-gray-400 mt-4">Yeh QR counter par chipka do</p><button onclick="this.closest('.fixed').remove()" class="mt-4 w-full bg-gray-900 text-white py-2.5 rounded-xl text-sm font-medium">Band karo</button></div>`;
  document.body.appendChild(modal);
  new QRCode(document.getElementById('qrCanvas'), { text: window.location.href.split('#')[0] + '#shop-' + shopId, width: 180, height: 180 });
}

function showReport(shopId) {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/60 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 fade-in">
      <h3 class="text-lg font-bold mb-4">${t('reportTitle')}</h3>
      <label class="text-sm font-medium text-gray-700 block mb-2">${t('reportReason')}</label>
      <select id="reportReason" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 mb-3 text-sm"><option>Certificate expired hai</option><option>Fake certificate lag raha hai</option><option>Shop band ho gayi hai</option><option>Address galat hai</option><option>Other</option></select>
      <textarea id="reportDetail" rows="3" placeholder="${t('reportPlaceholder')}" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 mb-3 text-sm"></textarea>
      <button onclick="submitReport(${shopId})" class="w-full bg-red-600 text-white py-3 rounded-xl font-semibold text-sm">${t('reportSubmit')}</button>
    </div>`;
  document.body.appendChild(modal);
}

async function submitReport(shopId) {
  const reason = document.getElementById('reportReason').value; const detail = document.getElementById('reportDetail').value;
  
  if (supabaseClient) {
    await supabaseClient.from('reports').insert([{ business_id: shopId, reason: reason, detail: detail }]);
    await loadSupabaseData(); // Reload
  } else {
    reports.push({ shopId, reason, detail, date: new Date().toISOString(), status: 'pending' }); save();
  }

  document.querySelectorAll('.fixed.inset-0').forEach(m => m.remove()); showToast(t('reportSuccess')); render();
}

function renderAdmin() {
  const pending = reports.filter(r => r.status === 'pending');
  return `
  <header class="bg-gray-900 text-white">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="navigate('home')" class="flex items-center gap-2 text-sm"><span>←</span> ${t('home')}</button>
      <span class="text-sm font-bold">${t('admin')}</span>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-5">
    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-100"><div class="text-2xl font-bold text-gray-900">${shops.length}</div><div class="text-xs text-gray-500 mt-1">Total shops</div></div>
      <div class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-100"><div class="text-2xl font-bold text-amber-600">${pending.length}</div><div class="text-xs text-gray-500 mt-1">Pending reports</div></div>
      <div class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-100"><div class="text-2xl font-bold text-green-600">${shops.filter(s => Object.values(s.certificates).some(c => c.status === 'admin_reviewed')).length}</div><div class="text-xs text-gray-500 mt-1">Reviewed shops</div></div>
    </div>
    <h2 class="font-bold text-gray-900 mb-3">${t('adminPending')}</h2>
    ${pending.length === 0 ? `<div class="bg-white rounded-2xl p-8 text-center text-gray-400 text-sm shadow-sm border border-gray-100">${t('noPending')}</div>` : `
      <div class="space-y-3">
        ${pending.map((r, i) => {
          const shop = shops.find(s => s.id === r.shopId);
          return `<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div class="flex justify-between items-start mb-2"><div><div class="font-semibold text-gray-900 text-sm">${shop?.name || 'Unknown shop'}</div><div class="text-xs text-red-600 font-medium mt-1">${r.reason}</div></div><span class="text-xs text-gray-400">${new Date(r.date).toLocaleDateString()}</span></div>
            ${r.detail ? `<p class="text-xs text-gray-600 mb-3">${r.detail}</p>` : ''}
            <button onclick="markReport(${i}, ${r.id || 0})" class="text-xs bg-green-600 text-white px-3 py-1.5 rounded-lg font-medium">${t('markReviewed')}</button>
          </div>`;
        }).join('')}
      </div>`}
  </main>`;
}

async function markReport(idx, dbId) {
  if (supabaseClient && dbId) {
    await supabaseClient.from('reports').update({ status: 'reviewed' }).eq('id', dbId);
    await loadSupabaseData();
  } else {
    const pending = reports.filter(r => r.status === 'pending');
    const target = pending[idx];
    if (target) { reports[reports.indexOf(target)].status = 'reviewed'; save(); }
  }
  render();
}

function toggleLang() { lang = lang === 'hi' ? 'en' : 'hi'; save(); render(); }

window.addEventListener('hashchange', () => {
  const match = window.location.hash.match(/^#shop-(\d+)/);
  if (match) navigate('shop', parseInt(match[1])); else navigate('home');
});

// Boot Sequence
async function boot() {
  if (supabaseClient) await loadSupabaseData();
  
  if (window.location.hash.match(/^#shop-\d+/)) {
    const id = parseInt(window.location.hash.match(/^#shop-(\d+)/)[1]);
    navigate('shop', id);
  } else {
    navigate('home');
  }
}
boot();

</script>
</body>
</html>
