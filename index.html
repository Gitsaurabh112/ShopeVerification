// Compute trust score
function trustScore(shop) {
  const certs = Object.values(shop.certificates || {});
  if (certs.length === 0) return 20;
  let base = 30;
  let reviewed = 0, expired = 0;
  for (const c of certs) {
    if (c.status === 'admin_reviewed') reviewed++;
    if (c.status === 'expired') expired++;
    if (c.status === 'unverified') base += 8;
  }
  base += reviewed * 18;
  base -= expired * 15;
  base += Math.min(shop.communityChecks * 2, 20);
  return Math.max(10, Math.min(98, base));
}

// Category emoji
function catIcon(cat) {
  if (/Food|Restaurant|Tiffin|Bakery|Sweet|Dairy/i.test(cat)) return "🍽️";
  if (/Salon|Beauty/i.test(cat)) return "💇";
  if (/Mobile|Electronics/i.test(cat)) return "📱";
  if (/Pharmacy|Ayurveda/i.test(cat)) return "💊";
  if (/Kirana|Grocery/i.test(cat)) return "🛒";
  return "🏪";
}

// Toast
function showToast(msg, type='success') {
  const toast = document.createElement('div');
  toast.className = `toast-enter fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl text-white font-medium text-sm shadow-2xl max-w-md ${
    type === 'error' ? 'bg-red-600' : 'bg-gray-900'
  }`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => toast.remove(), 3600);
}

// Copy & verify flow — THE HEART OF THE APP
function copyAndVerify(shopId, certType) {
  const shop = shops.find(s => s.id === shopId);
  const cert = shop.certificates[certType];
  const portal = PORTALS[certType];
  if (!cert || !portal) return;

  navigator.clipboard.writeText(cert.number).then(() => {
    showToast(t('toastCopied'));
  }).catch(() => {
    // fallback for old browsers
    const ta = document.createElement('textarea');
    ta.value = cert.number;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    showToast(t('toastCopied'));
  });

  setTimeout(() => window.open(portal.url, '_blank'), 400);
  showVerificationSteps(shopId, certType);
}

    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 fade-in max-h-[90vh] overflow-y-auto">
      <div class="flex items-start justify-between mb-4">

          <h3 class="text-lg font-bold text-gray-900">${portal.name}</h3>
          <p class="text-xs text-gray-500 mt-1">${t('portal')}</p>
        </div>
        <button onclick="this.closest('.fixed').remove()" class="text-gray-400 text-2xl leading-none">×</button>
      </div>

      <div class="bg-green-50 border border-green-200 rounded-xl p-3 mb-4">
        <p class="text-xs text-green-800 mb-1 font-semibold">${t('fieldToCopy')}</p>
        <div class="flex items-center gap-2">
          <code class="flex-1 font-mono text-sm text-gray-800 break-all">${cert.number}</code>
          <span class="text-xs bg-green-600 text-white px-2 py-1 rounded-md">Copied ✓</span>
        </div>
      </div>

      <h4 class="font-semibold text-gray-900 mb-3 text-sm">${t('steps')}:</h4>
      <ol class="space-y-2 mb-5">
        ${steps.map((s, i) => `
          <li class="flex gap-3 text-sm text-gray-700">
            <span class="flex-shrink-0 w-6 h-6 rounded-full bg-gray-900 text-white flex items-center justify-center text-xs font-bold">${i+1}</span>
            <span class="pt-0.5">${s}</span>
          </li>
        `).join('')}
      </ol>

      <div class="space-y-2">
        <a href="${portal.url}" target="_blank" class="block w-full text-center bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-xl font-semibold text-sm">
          Portal phir se kholo →
        </a>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="markCheck(${shopId},'${certType}','active')" class="bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl text-sm font-medium">
            ✅ Active tha
          </button>
          <button onclick="markCheck(${shopId},'${certType}','expired')" class="bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-xl text-sm font-medium">
            ❌ Expired tha
          </button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function markCheck(shopId, certType, result) {
  const shop = shops.find(s => s.id === shopId);
  if (!shop) return;
  const cert = shop.certificates[certType];
  if (result === 'active' && cert.status === 'unverified') {
    cert.status = 'community';
  } else if (result === 'expired') {
    cert.status = 'expired';
  }
  shop.communityChecks = (shop.communityChecks || 0) + 1;
  save();
  document.querySelectorAll('.fixed.inset-0').forEach(m => m.remove());
  showToast(t('toastChecked'));
  render();
}

// Status pill
function statusPill(status) {
  const styles = {
    unverified: 'bg-gray-100 text-gray-700 border-gray-200',
    admin_reviewed: 'bg-blue-50 text-blue-700 border-blue-200',
    community: 'bg-green-50 text-green-700 border-green-200',
    expired: 'bg-red-50 text-red-700 border-red-200'
  };
  const icons = { unverified: '⚪', admin_reviewed: '🔵', community: '🟢', expired: '🔴' };
  return `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium border ${styles[status] || styles.unverified}">
    ${icons[status] || ''} ${t('status')[status] || status}
  </span>`;
}

// ROUTER

  currentView = view;
  currentShopId = id;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById('app');
  if (currentView === 'home') app.innerHTML = renderHome();
  else if (currentView === 'shop') app.innerHTML = renderShop(currentShopId);
  else if (currentView === 'admin') app.innerHTML = renderAdmin();
  app.classList.add('fade-in');
}

      </div>
    `}

    <div class="mt-8 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-800">
      ${t('disclaimer')}
    </div>
  </main>
  `;
}

function shopCard(s) {
  const score = trustScore(s);
  const scoreColor = score >= 70 ? 'bg-green-500' : score >= 40 ? 'bg-amber-500' : 'bg-red-500';
  return `
  <div onclick="navigate('shop',${s.id})" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:shadow-md hover:border-gray-200 cursor-pointer transition-all">
    <div class="flex items-start gap-3">
      <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center text-2xl flex-shrink-0">${catIcon(s.category)}</div>
      <div class="flex-1 min-w-0">
        <h3 class="font-bold text-gray-900 truncate">${s.name}</h3>
        <p class="text-xs text-gray-500 truncate">${s.category}</p>
        <p class="text-xs text-gray-400 truncate mt-1">${s.area}</p>
        <div class="flex items-center gap-2 mt-2 flex-wrap">
          ${Object.entries(s.certificates).slice(0,3).map(([k,v]) => statusPill(v.status)).join('')}
        </div>
      </div>
      <div class="text-right flex-shrink-0">
        <div class="text-xs text-gray-500 mb-1">${t('trustScore')}</div>
        <div class="inline-flex items-center gap-1 px-2 py-1 rounded-lg ${scoreColor} text-white text-sm font-bold">
          ${score}
        </div>
      </div>
    </div>
  </div>`;
}

// SHOP DETAIL
function renderShop(id) {
  const s = shops.find(x => x.id === id);
  if (!s) return `<div class="p-8 text-center">Shop not found</div>`;
  const score = trustScore(s);
  const scoreColor = score >= 70 ? 'text-green-600' : score >= 40 ? 'text-amber-600' : 'text-red-600';

  return `
  <header class="bg-white border-b border-gray-100 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="navigate('home')" class="flex items-center gap-2 text-gray-700 hover:text-gray-900">
        <span>←</span> <span class="text-sm font-medium">${t('back')}</span>
      </button>
      <div class="flex items-center gap-2">
        <button onclick="showQR(${s.id})" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-medium">${t('showQR')}</button>
        <button onclick="showReport(${s.id})" class="text-xs bg-red-50 hover:bg-red-100 text-red-700 px-3 py-1.5 rounded-lg font-medium">${t('reportShop')}</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5">
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
      <div class="flex items-start gap-4">
        <div class="w-16 h-16 rounded-2xl bg-gray-100 flex items-center justify-center text-3xl flex-shrink-0">${catIcon(s.category)}</div>
        <div class="flex-1 min-w-0">
          <h1 class="text-xl font-bold text-gray-900">${s.name}</h1>
          <p class="text-sm text-gray-500">${s.category}</p>
          <p class="text-xs text-gray-400 mt-2">📍 ${s.address}</p>
          <p class="text-xs text-gray-400 mt-1">📞 ${s.phone} · 👤 ${s.owner}</p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-3 gap-2 text-center">
        <div>
          <div class="text-2xl font-bold ${scoreColor}">${score}</div>
          <div class="text-xs text-gray-500">${t('trustScore')}</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-gray-900">${s.communityChecks || 0}</div>
          <div class="text-xs text-gray-500">${t('communityChecks')}</div>
        </div>
        <div>
          <div class="text-2xl font-bold text-gray-900">${s.adminReviews || 0}</div>
          <div class="text-xs text-gray-500">${t('adminReviewed')}</div>
        </div>
      </div>
    </div>

    <h2 class="font-bold text-gray-900 mb-3 px-1">${t('certificates')}</h2>
    <div class="space-y-3">
      ${Object.entries(s.certificates).map(([type, cert]) => renderCertCard(s.id, type, cert)).join('')}
    </div>

    <div class="mt-6 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-800">
      ${t('disclaimer')}
    </div>
  </main>
  `;
}

function renderCertCard(shopId, type, cert) {
  const portal = PORTALS[type];
  if (!portal) return '';
  const isExpired = cert.expiry && new Date(cert.expiry) < new Date();
  const effectiveStatus = isExpired && cert.status !== 'expired' ? 'expired' : cert.status;

  return `
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
    <div class="flex items-start justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">${portal.icon}</span>
        <div>
          <div class="font-semibold text-gray-900 text-sm">${portal.name.split('(')[0].trim()}</div>
          <div class="text-xs text-gray-500">${portal.fieldName}</div>
        </div>
      </div>
      ${statusPill(effectiveStatus)}
    </div>

    <div class="bg-gray-50 rounded-xl px-3 py-2 my-3">
      <code class="text-xs font-mono text-gray-800 break-all">${cert.number}</code>
    </div>

    ${cert.expiry ? `<div class="text-xs text-gray-500 mb-3">📅 ${t('expiryDate')}: ${cert.expiry}${cert.verifiedAt ? ` · ✓ ${t('verifiedOn')} ${cert.verifiedAt}` : ''}</div>` : ''}

    <p class="text-xs text-gray-500 mb-3">${t('statusDesc')[effectiveStatus] || ''}</p>

    <button onclick="copyAndVerify(${shopId},'${type}')" 
      class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
      <span>📋</span> ${t('copyVerify')} →
    </button>
    <p class="text-xs text-gray-400 text-center mt-2">${t('copyVerifyHint')}</p>
  </div>`;
}

// QR modal
function showQR(shopId) {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  const shop = shops.find(s => s.id === shopId);
  modal.innerHTML = `
    <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center fade-in">
      <h3 class="font-bold mb-1">${shop.name}</h3>
      <p class="text-xs text-gray-500 mb-4">Scan karo aur verify karo</p>
      <div id="qrCanvas" class="inline-block p-3 bg-white border-2 border-gray-200 rounded-2xl"></div>
      <p class="text-xs text-gray-400 mt-4">Yeh QR counter par chipka do</p>
      <button onclick="this.closest('.fixed').remove()" class="mt-4 w-full bg-gray-900 text-white py-2.5 rounded-xl text-sm font-medium">Band karo</button>
    </div>
  `;
  document.body.appendChild(modal);
  new QRCode(document.getElementById('qrCanvas'), {
    text: window.location.href.split('#')[0] + '#shop-' + shopId,
    width: 180, height: 180
  });
}

// Report modal
function showReport(shopId) {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black/60 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4';
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 fade-in">
      <h3 class="text-lg font-bold mb-4">${t('reportTitle')}</h3>
      <label class="text-sm font-medium text-gray-700 block mb-2">${t('reportReason')}</label>
      <select id="reportReason" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 mb-3 text-sm">
        <option>Certificate expired hai</option>
        <option>Fake certificate lag raha hai</option>
        <option>Shop band ho gayi hai</option>
        <option>Address galat hai</option>
        <option>Other</option>
      </select>
      <textarea id="reportDetail" rows="3" placeholder="${t('reportPlaceholder')}"
        class="w-full border border-gray-200 rounded-xl px-3 py-2.5 mb-3 text-sm"></textarea>
      <button onclick="submitReport(${shopId})" class="w-full bg-red-600 text-white py-3 rounded-xl font-semibold text-sm">${t('reportSubmit')}</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function submitReport(shopId) {
  const reason = document.getElementById('reportReason').value;
  const detail = document.getElementById('reportDetail').value;
  reports.push({ shopId, reason, detail, date: new Date().toISOString(), status: 'pending' });
  save();
  document.querySelectorAll('.fixed.inset-0').forEach(m => m.remove());
  showToast(t('reportSuccess'));
  render();
}

// ADMIN
function renderAdmin() {
  const pending = reports.filter(r => r.status === 'pending');
  return `
  <header class="bg-gray-900 text-white">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="navigate('home')" class="flex items-center gap-2 text-sm">
        <span>←</span> ${t('home')}
      </button>
      <span class="text-sm font-bold">${t('admin')}</span>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 py-5">
    <div class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-100">
        <div class="text-2xl font-bold text-gray-900">${shops.length}</div>
        <div class="text-xs text-gray-500 mt-1">Total shops</div>
      </div>
      <div class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-100">
        <div class="text-2xl font-bold text-amber-600">${pending.length}</div>
        <div class="text-xs text-gray-500 mt-1">Pending reports</div>
      </div>
      <div class="bg-white rounded-2xl p-4 text-center shadow-sm border border-gray-100">
        <div class="text-2xl font-bold text-green-600">${shops.filter(s => Object.values(s.certificates).some(c => c.status === 'admin_reviewed')).length}</div>
        <div class="text-xs text-gray-500 mt-1">Reviewed shops</div>
      </div>
    </div>

    <h2 class="font-bold text-gray-900 mb-3">${t('adminPending')}</h2>
    ${pending.length === 0 ? `<div class="bg-white rounded-2xl p-8 text-center text-gray-400 text-sm shadow-sm border border-gray-100">${t('noPending')}</div>` : `
      <div class="space-y-3">
        ${pending.map((r, i) => {
          const shop = shops.find(s => s.id === r.shopId);
          return `<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div class="flex justify-between items-start mb-2">
              <div>
                <div class="font-semibold text-gray-900 text-sm">${shop?.name || 'Unknown shop'}</div>
                <div class="text-xs text-red-600 font-medium mt-1">${r.reason}</div>
              </div>
              <span class="text-xs text-gray-400">${new Date(r.date).toLocaleDateString()}</span>
            </div>
            ${r.detail ? `<p class="text-xs text-gray-600 mb-3">${r.detail}</p>` : ''}
            <button onclick="markReport(${i})" class="text-xs bg-green-600 text-white px-3 py-1.5 rounded-lg font-medium">
              ${t('markReviewed')}
            </button>
          </div>`;
        }).join('')}
      </div>
    `}
  </main>
  `;
}

function markReport(idx) {
  const pending = reports.filter(r => r.status === 'pending');
  const target = pending[idx];
  if (target) {
    const realIdx = reports.indexOf(target);
    reports[realIdx].status = 'reviewed';
    save();
    render();
  }
}

function toggleLang() {
  lang = lang === 'hi' ? 'en' : 'hi';
  save();
  render();
}

// Hash routing for QR support
window.addEventListener('hashchange', () => {
  const match = window.location.hash.match(/^#shop-(\d+)/);
  if (match) navigate('shop', parseInt(match[1]));
  else navigate('home');
});

// Boot
if (window.location.hash.match(/^#shop-\d+/)) {
  const id = parseInt(window.location.hash.match(/^#shop-(\d+)/)[1]);
  navigate('shop', id);
} else {
  navigate('home');
}
</script>
</body>
</html>
